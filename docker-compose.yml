services:
  upprice:
    build: .
    container_name: upprice-24h-service
    restart: always
    ports:
      - "${PORT:-4000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
